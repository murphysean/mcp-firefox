[project]
name = "mcp-firefox"
version = "0.1.0"
description = "MCP server that proxies Firefox DevTools Remote Debugging Protocol"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
firefox-mcp = "firefox_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["firefox_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
